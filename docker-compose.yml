version: "3.9"

# Muneem Ji dev services — database and object storage are hosted (Neon + AWS S3).
# Only the Python pdfplumber sandbox runs locally.

services:
  python-sandbox:
    build:
      context: ./docker/python-sandbox
      dockerfile: Dockerfile
    container_name: muneem-python-sandbox
    ports:
      - "8080:8080"
    restart: unless-stopped
    # The host (Next.js / Inngest dev) reaches the sandbox on :8080. Requests are
    # authenticated with the same PARSER_SECRET used in prod (set in your shell
    # / .env.local). Only the baked-in extract-pages.py / render_page.py run.
    environment:
      - PARSER_SECRET=${PARSER_SECRET}
